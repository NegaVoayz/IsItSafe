[package]
name = "isitsafe-analysis"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[features]
default = []
yara = ["dep:yara-x"]

[dependencies]
cab = "0.6"
chrono = { version = "0.4", features = ["serde"] }
cross-authenticode = "1.0.3"
der = "0.7"
goblin = "0.10"
hex = "0.4"
inno = { version = "0.7.3", features = ["extract"] }
isitsafe-config = { version = "0.1.0", path = "../isitsafe-config" }
isitsafe-detect = { version = "0.1.0", path = "../isitsafe-detect" }
isitsafe-report = { version = "0.1.0", path = "../isitsafe-report" }
msi = "0.11"
nsis = "0.6"
rar-codec = "0.1.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
x509-parser = "0.17"
yara-x = { version = "1", optional = true }
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "lzma", "time"] }
