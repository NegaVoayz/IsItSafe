download_dir = 'C:\Users\me\Downloads'

[storage]
# Choose any writable folder on another drive. Existing quarantine entries are
# never moved when this setting changes.
quarantine_dir = 'C:\Users\me\AppData\Local\IsItSafe\quarantine'

[runtime]
monitor_enabled = true
start_at_login = false

[security]
block_execution_in_download_dir = true

[interaction]
# Post Windows notifications with Keep, Quarantine, and Remove actions.
enabled = true

[limits]
snapshot_max_bytes = 536870912
basic_check_threshold_bytes = 2147483648
lock_acquisition_timeout_ms = 30000
lock_acquisition_retry_backoff_ms = 250
motw_read_timeout_ms = 5000
motw_retry_backoff_ms = 100
child_committed_memory_bytes = 1342177280
child_cpu_time_ms = 120000
child_wall_time_ms = 300000
child_output_max_bytes = 67108864
entry_max_bytes = 268435456
total_output_max_bytes = 2147483648
max_entries = 10000
max_depth = 8
compression_ratio_warning = 200
max_network_response_bytes = 8388608

[events]
debounce_ms = 5000
temp_rename_grace_ms = 3600000
temp_extensions = ['.crdownload', '.part', '.tmp', '.download', '.opdownload', '.partial']
reconciliation_interval_ms = 300000
origin_correlation_window_ms = 1800000
follow_reparse_points = false

[origin]
enabled = true
max_message_bytes = 1048576
chrome_extension_ids = []
firefox_extension_ids = []

[child]
use_app_container = true

[virus_total]
enabled = true
base_url = 'https://www.virustotal.com/api/v3'
requests_per_minute = 4
cache_ttl_seconds = 86400
request_timeout_ms = 15000
upload_unknown = false
always_query = false
# api_key = 'set only in an ignored local config.toml'

[reports]
retention_days = 30
max_total_bytes = 2147483648
log_max_bytes = 10485760
log_retained_files = 5

[policy]
allowlist = []
blocked_origins = []
review_origins = []
quarantine_enabled = true
quarantine_review_required = false
quarantine_retention_days = 30
signer_categories = {}

[yara]
enabled = false
remote_manifest_url = ''
public_key_base64 = ''
max_rules_bytes = 16777216

