name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: isitsafe-windows-x64-installer
          path: |
            dist/IsItSafe-*-windows-x64-setup.exe
            dist/IsItSafe-*-windows-x64-setup.exe.sha256
      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "IsItSafe $tag" --generate-notes
          }
          gh release upload $tag dist/IsItSafe-*-windows-x64-setup.exe dist/IsItSafe-*-windows-x64-setup.exe.sha256 --clobber
