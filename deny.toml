[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
ignore = [
  # Reachability is limited to public-key Authenticode verification.
  "RUSTSEC-2023-0071",
  # Transitive object compression support is not used for PE parsing.
  "RUSTSEC-2026-0344",
  # Informational advisories pulled in by the desktop renderer stack.
  "RUSTSEC-2025-0141",
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  "ISC",
  "OFL-1.1",
  "Unicode-3.0",
  "Ubuntu-font-1.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

