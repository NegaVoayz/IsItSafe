[package]
name = "isitsafe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Safety checker for downloaded Windows executables, installers, and archives"
license = "MIT"

[lib]
name = "isitsafe"
path = "src/lib.rs"

[[bin]]
name = "isitsafe"
path = "src/main.rs"

[[bin]]
name = "isitsafe-native-host"
path = "src/native_main.rs"

[[bin]]
name = "isitsafe-ui"
path = "src/ui_main.rs"

[features]
default = []
yara = ["dep:yara-x"]

[dependencies]
anyhow = "1"
base64 = "0.22"
cab = "0.6"
cfb = "0.16"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cross-authenticode = "1.0.3"
der = "0.7"
hex = "0.4"
inno = { version = "0.7.3", features = ["extract"] }
msi = "0.11"
notify = "8"
nsis = "0.6"
once_cell = "1"
parking_lot = "0.12"
rar-codec = "0.1.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
wait-timeout = "0.2"
x509-parser = "0.17"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "lzma", "time"] }
yara-x = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
egui_extras = { version = "0.37.0", default-features = false }
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "UI_Notifications",
] }
windows-registry = "0.6.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Isolation",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

